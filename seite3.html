    <script>function menuOeffnen() {
    let menu = document.getElementById("menu");

    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
function checkAntwort1(event) {
    event.preventDefault();

    let antwort = document.getElementById("antwort1").value;

    if (antwort === "Wien") {
        document.getElementById("ergebnis1").textContent = "Richtig!";
    } else {
        document.getElementById("ergebnis1").textContent = "Falsch!";
    }
}
function checkAntwort2(event) {
    event.preventDefault();

    let antwort = document.getElementById("antwort2").value;

    if (antwort.toLowerCase() === "2") {
        document.getElementById("ergebnis2").textContent = "Richtig!";
    } else {
        document.getElementById("ergebnis2").textContent = "Falsch!";
    }
} 
function checkAntwort3(event) {
    event.preventDefault();

    let istRichtig = document.getElementById("radio1").checked;
    

    if (istRichtig) {
        document.getElementById("ergebnis3").textContent = "Richtig aber geh duschen und touch some grass brochacho!";
}     else {
    document.getElementById("ergebnis3").textContent = "Falsch! Lüg nicht!";
}
}
</script>

</form>

 <p>3. Wie oft hast du in den letzten 7 Tagen geduscht/Gras berührt</p>
 <form onsubmit="checkAntwort3(event)">
