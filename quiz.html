<script>
(function () {

      "Fleisch",
      "Zucker",
      "Reis",
      "Pflanzenöl",
      "Eiweiß steckt z. B. in Fleisch, Eiern, Fisch, Milch und Hülsenfrüchten."],
    [T1, "Wie kann man zu Kohlenhydraten, Fetten und Eiweißen noch sagen?",

    var row2 = el("div", "bq-row");
    startBtn.addEventListener("click", function () {
      var all = QUESTIONS.filter(function (q) { return selected[q[0]]; });
      var list = shuffle(all);
      if (amount > 0) list = list.slice(0, amount);
      startQuiz(list);
    });
    row2.appendChild(startBtn);
    root.appendChild(row2);
    updateStart();
  }

  /* ---------- Quiz ---------- */
  function startQuiz(list) {
    pool = list;
    idx = 0;
    score = 0;
    wrongList = [];
    perTopic = {};
    showQuestion();
  }

  function showQuestion() {
    clear(root);
    answered = false;
    var q = pool[idx];
    var opts = shuffle([
      { text: q[2], ok: true },
      { text: q[3], ok: false },
      { text: q[4], ok: false },
      { text: q[5], ok: false }
    ]);
    current = { q: q, opts: opts };

    var bar = el("div", "bq-bar");
    var fill = el("div");
    fill.style.width = (idx / pool.length * 100) + "%";
    bar.appendChild(fill);
    bar.setAttribute("role", "progressbar");
    bar.setAttribute("aria-valuemin", "0");
    bar.setAttribute("aria-valuemax", String(pool.length));
    bar.setAttribute("aria-valuenow", String(idx));
    root.appendChild(bar);

    var meta = el("div", "bq-meta bq-muted");
    meta.appendChild(el("span", "", "Frage " + (idx + 1) + " von " + pool.length));
    meta.appendChild(el("span", "", q[0] + " · " + score + " richtig"));
    root.appendChild(meta);

    var card = el("div", "bq-card");
    card.appendChild(el("p", "bq-q", q[1]));

    var list = el("div", "bq-opts");
    var btns = [];
    opts.forEach(function (o, i) {
      var b = el("button", "bq-opt");
      b.appendChild(el("span", "bq-key", LETTERS[i]));
      b.appendChild(el("span", "", o.text));
      b.addEventListener("click", function () { choose(i); });
      list.appendChild(b);
      btns.push(b);
    });
    card.appendChild(list);

    var fb = el("div");
    fb.setAttribute("role", "status");
    card.appendChild(fb);
    root.appendChild(card);

    var nextRow = el("div", "bq-row");
    var next = el("button", "bq-primary", idx + 1 === pool.length ? "Ergebnis ansehen" : "Weiter");
    next.style.display = "none";
    next.addEventListener("click", goNext);
    nextRow.appendChild(next);
    var quit = el("button", "", "Abbrechen");
    quit.addEventListener("click", showStart);
    nextRow.appendChild(quit);
    root.appendChild(nextRow);

    current.btns = btns;
    current.fb = fb;
    current.next = next;
    focusRoot();
  }

  function choose(i) {
    if (answered) return;
    answered = true;
    var q = current.q;
    var o = current.opts[i];
    perTopic[q[0]] = perTopic[q[0]] || { r: 0, n: 0 };
    perTopic[q[0]].n++;

    current.btns.forEach(function (b, k) {
      b.disabled = true;
      if (current.opts[k].ok) b.classList.add("bq-right");
    });

    var box = el("div", "bq-fb " + (o.ok ? "ok" : "no"));
    if (o.ok) {
      score++;
      perTopic[q[0]].r++;
      box.appendChild(el("strong", "", "Richtig."));
    } else {
      current.btns[i].classList.add("bq-wrong");
      wrongList.push(q);
      box.appendChild(el("strong", "", "Nicht ganz."));
    }
    box.appendChild(el("span", "", q[6]));
    current.fb.appendChild(box);
    current.next.style.display = "";
    current.next.focus();
  }

  function goNext() {
    if (!answered) return;
    idx++;
    if (idx >= pool.length) showResult(); else showQuestion();
  }

  /* ---------- Ergebnis ---------- */
  function showResult() {
    clear(root);
    current = null;
    var pct = Math.round(score / pool.length * 100);
    var h = el("h2");
    h.appendChild(el("span", "", "Ergebnis"));
    root.appendChild(h);
    root.appendChild(el("div", "bq-score", score + " / " + pool.length));
    var msg = pct >= 90 ? "Sehr stark – du bist bereit für den Test."
            : pct >= 70 ? "Gut. Schau dir die Fehler unten noch einmal an."
            : pct >= 50 ? "Noch nicht sicher. Übe die falschen Fragen gleich nochmal."
            : "Das Thema braucht noch Zeit. Lies die Erklärungen und versuche es erneut.";
    root.appendChild(el("p", "", pct + " % – " + msg));

    var topicsDone = Object.keys(perTopic);
    if (topicsDone.length) {
      root.appendChild(el("h3", "", "Nach Thema"));
      var tbl = el("table");
      var head = el("tr");
      head.appendChild(el("th", "", "Thema"));
      head.appendChild(el("th", "", "Richtig"));
      tbl.appendChild(head);
      topicsDone.forEach(function (t) {
        var r = el("tr");
        r.appendChild(el("td", "", t));
        r.appendChild(el("td", "", perTopic[t].r + " / " + perTopic[t].n));
        tbl.appendChild(r);
      });
      root.appendChild(tbl);
    }

    if (wrongList.length) {
      root.appendChild(el("h3", "", "Das solltest du nochmal anschauen"));
      wrongList.forEach(function (q) {
        var d = el("div", "bq-miss");
        d.appendChild(el("b", "", q[1]));
        d.appendChild(el("span", "", q[2]));
        d.appendChild(el("div", "bq-muted", q[6]));
        root.appendChild(d);
      });
    }

    var row = el("div", "bq-row");
    if (wrongList.length) {
      var again = el("button", "bq-primary", "Falsche Fragen üben (" + wrongList.length + ")");
      again.addEventListener("click", function () { startQuiz(shuffle(wrongList)); });
      row.appendChild(again);
    }
    var restart = el("button", "", "Neues Quiz");
    restart.addEventListener("click", showStart);
    row.appendChild(restart);
    root.appendChild(row);
    focusRoot();
  }

  /* ---------- Tastatur: 1–4 oder A–D wählen, Enter = weiter ---------- */
  root.addEventListener("keydown", function (e) {
    if (!current) return;
    var k = e.key;
    var map = { "1": 0, "2": 1, "3": 2, "4": 3, "a": 0, "b": 1, "c": 2, "d": 3, "A": 0, "B": 1, "C": 2, "D": 3 };
    if (!answered && map.hasOwnProperty(k)) { e.preventDefault(); choose(map[k]); }
    else if (answered && k === "Enter") { e.preventDefault(); goNext(); }
  });

  showStart();
})();
</script>
    </div>
</body>
</html>
